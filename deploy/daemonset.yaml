apiVersion: v1
kind: Namespace
metadata:
  name: zero-copy

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: zero-copy-daemonset
  namespace: zero-copy

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: zero-copy-daemonset
  namespace: zero-copy
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: zero-copy-daemonset
  namespace: zero-copy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: zero-copy-daemonset
subjects:
  - kind: ServiceAccount
    name: zero-copy-daemonset
    namespace: zero-copy

---

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: zero-copy-agent
  namespace: zero-copy
spec:
  selector:
    matchLabels:
      app: zero-copy-agent
  template:
    metadata:
      labels:
        app: zero-copy-agent
    spec:
      serviceAccountName: zero-copy-daemonset
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
      - operator: Exists
      initContainers:
      - name: mount-bpf
        image: wasay786/zero-copy:dev
        imagePullPolicy: Always
        securityContext:
          runAsUser: 0
          privileged: true
        command: ["/bin/sh", "-c"]
        args:
        - if ! grep -q ' /sys/fs/bpf bpf ' /proc/self/mountinfo; then mount -t bpf bpf /sys/fs/bpf; fi
        volumeMounts:
        - name: bpf-fs
          mountPath: /sys/fs/bpf
          mountPropagation: Bidirectional
      containers:
      - name: go-app
        image: wasay786/zero-copy:dev
        imagePullPolicy: Always
        securityContext:
          runAsUser: 0
          privileged: true
        env:
        # Injects the specific node name this DaemonSet pod lands on
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: cni-config-dir
          mountPath: /host/etc/cni/net.d
        - name: cni-bin-dir
          mountPath: /host/opt/cni/bin
        - name: cni-state-dir
          mountPath: /var/lib/cni/zero-copy
        - name: bpf-fs
          mountPath: /sys/fs/bpf
          mountPropagation: Bidirectional
      volumes:
      - name: cni-config-dir
        hostPath:
          path: /etc/cni/net.d
          type: DirectoryOrCreate
      - name: cni-bin-dir
        hostPath:
          path: /opt/cni/bin
          type: DirectoryOrCreate
      - name: cni-state-dir
        hostPath:
          path: /var/lib/cni/zero-copy
          type: DirectoryOrCreate
      - name: bpf-fs
        hostPath:
          path: /sys/fs/bpf
          type: DirectoryOrCreate