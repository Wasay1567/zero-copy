apiVersion: v1
kind: Namespace
metadata:
  name: zero-copy

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: zero-copy-daemonset
  namespace: zero-copy

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: zero-copy-daemonset
  namespace: zero-copy
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: zero-copy-daemonset
  namespace: zero-copy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: zero-copy-daemonset
subjects:
  - kind: ServiceAccount
    name: zero-copy-daemonset
    namespace: zero-copy

---

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: zero-copy-agent
  namespace: zero-copy
spec:
  selector:
    matchLabels:
      app: zero-copy-agent
  template:
    metadata:
      labels:
        app: zero-copy-agent
    spec:
      serviceAccountName: zero-copy-daemonset
      containers:
      - name: go-app
        image: Wasay:latest #CHANGE
        securityContext:
          runAsUser: 0
          priveledged: true
        env:
        # Injects the specific node name this DaemonSet pod lands on
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
          name: cni-config-dir
          path: /host/etc/cni/net.d
      volumes:
      - name: cni-config-dir
        hostPath:
          path: /etc/cni/net.d
          type: Directory